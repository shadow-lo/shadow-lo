<svg xmlns="http://www.w3.org/2000/svg" width="420" height="176" viewBox="0 0 420 176" role="img" aria-label="+11 repo daha">
<title>+11 repo daha</title>
<defs>
  <linearGradient id="bgmoretr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e0a24"/><stop offset="1" stop-color="#1d1046"/>
  </linearGradient>
  <linearGradient id="acmoretr" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a970ff"/><stop offset="1" stop-color="#d16bff"/>
  </linearGradient>
  <filter id="glowmoretr" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#ece8ff}
  .l{font:400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#a59bd0}
  .v{font:700 15px 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;fill:#ece8ff}
  .big{font:800 34px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#f3f0ff}
  .s{font:400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#a59bd0}
</style>
<rect x="0.5" y="0.5" width="419" height="175" rx="14" fill="url(#bgmoretr)" stroke="#3b2a78"/>
<circle cx="380" cy="22" r="1.2" fill="#f3f0ff" opacity="0.7"/><circle cx="330" cy="40" r="0.8" fill="#f3f0ff" opacity="0.5"/><circle cx="270" cy="18" r="1" fill="#f3f0ff" opacity="0.4"/><circle cx="360" cy="146" r="0.8" fill="#f3f0ff" opacity="0.35"/><circle cx="40" cy="154" r="0.9" fill="#f3f0ff" opacity="0.3"/>

