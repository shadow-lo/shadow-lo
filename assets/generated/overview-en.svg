<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="Overview">
<title>Overview</title>
<defs>
  <linearGradient id="bgoven" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e0a24"/><stop offset="1" stop-color="#1d1046"/>
  </linearGradient>
  <linearGradient id="acoven" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a970ff"/><stop offset="1" stop-color="#d16bff"/>
  </linearGradient>
  <filter id="glowoven" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#ece8ff}
  .l{font:400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#a59bd0}
  .v{font:700 15px 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;fill:#ece8ff}
  .big{font:800 34px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#f3f0ff}
  .s{font:400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#a59bd0}
</style>
<rect x="0.5" y="0.5" width="639" height="239" rx="14" fill="url(#bgoven)" stroke="#3b2a78"/>
<circle cx="600" cy="22" r="1.2" fill="#f3f0ff" opacity="0.7"/><circle cx="550" cy="40" r="0.8" fill="#f3f0ff" opacity="0.5"/><circle cx="490" cy="18" r="1" fill="#f3f0ff" opacity="0.4"/><circle cx="580" cy="210" r="0.8" fill="#f3f0ff" opacity="0.35"/><circle cx="40" cy="218" r="0.9" fill="#f3f0ff" opacity="0.3"/>
<text x="28" y="40" class="t">🌙 Overview</text>
<rect x="28" y="52" width="46" height="3" rx="1.5" fill="url(#acoven)"/>
<g class="fade" style="animation-delay:0ms"><text x="30" y="86" class="l" fill="#a970ff" style="fill:#a970ff">✦</text><text x="52" y="86" class="l">Total contributions</text><text x="330" y="86" class="v" text-anchor="end">41</text></g>
<g class="fade" style="animation-delay:120ms"><text x="30" y="114" class="l" fill="#a970ff" style="fill:#a970ff">◆</text><text x="52" y="114" class="l">Commits (2026)</text><text x="330" y="114" class="v" text-anchor="end">18</text></g>
<g class="fade" style="animation-delay:240ms"><text x="30" y="142" class="l" fill="#a970ff" style="fill:#a970ff">❖</text><text x="52" y="142" class="l">Public repos</text><text x="330" y="142" class="v" text-anchor="end">10</text></g>
<g class="fade" style="animation-delay:360ms"><text x="30" y="170" class="l" fill="#a970ff" style="fill:#a970ff">★</text><text x="52" y="170" class="l">Stars earned</text><text x="330" y="170" class="v" text-anchor="end">2</text></g>
<g class="fade" style="animation-delay:480ms"><text x="30" y="198" class="l" fill="#a970ff" style="fill:#a970ff">⇄</text><text x="52" y="198" class="l">Pull requests</text><text x="330" y="198" class="v" text-anchor="end">0</text></g>

<line x1="370" y1="40" x2="370" y2="206" stroke="#3b2a78"/>
<circle cx="515" cy="112" r="52" fill="none" stroke="#3b2a78" stroke-width="8"/>
<circle cx="515" cy="112" r="52" fill="none" stroke="url(#acoven)" stroke-width="8" stroke-linecap="round"
  stroke-dasharray="326.7 326.7" transform="rotate(-90 515 112)" filter="url(#glowoven)"/>
<text x="515" y="124" class="big" text-anchor="middle">2</text>
<text x="515" y="194" class="l" text-anchor="middle" style="font-weight:600;fill:#ece8ff">🔥 Current streak</text>
<text x="515" y="211" class="s" text-anchor="middle">Longest streak: 2 days</text>
<text x="515" y="32" class="s" text-anchor="middle">since 13 Jul 2020</text>

</svg>
